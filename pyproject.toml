[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tpami3-sparse-readout"
version = "0.1.0"
description = "Sparse response-state readouts and paired evaluation tools"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
readout = ["torch>=2.4,<3"]
figures = ["matplotlib>=3.7,<4"]

[project.scripts]
tpami3 = "tpami3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
